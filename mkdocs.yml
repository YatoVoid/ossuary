site_name: Ossuary
site_description: A first-person horror prototype written in HolyC, rendered with SDL2 and OpenGL.
site_url: https://yatovoid.github.io/ossuary/
repo_url: https://github.com/YatoVoid/ossuary
repo_name: YatoVoid/ossuary
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started:
      - Setup: setup.md
      - Build and test: build.md
  - Playing:
      - Controls: controls.md
      - Gameplay: gameplay.md
  - Development:
      - Architecture: architecture.md
      - Contributing: contributing.md
      - Roadmap: roadmap.md
  - FAQ: faq.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
